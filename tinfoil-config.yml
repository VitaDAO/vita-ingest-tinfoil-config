# Tinfoil Container Configuration — vita-ingest production
#
# PUBLIC REPO. Do not commit secret values here.
# This manifest pins the vita-ingest image digest used for attestation.

cvm-version: 0.7.5
cpus: 2
memory: 4096

containers:
  - name: vita-ingest
    image: "ghcr.io/vitadao/vita-ingest:sha-f90c3b6@sha256:dc62f16e0b0e23419ef0205bc6dd77aedd1c85f600aff4f57d25cebc6dea3a2c"
    registry:
      username: DobrinAlexandru
      password_secret: VITA_INGEST_GHCR_TOKEN

    env:
      - PORT: "8080"
      # Must match the public Tinfoil URL registered as the OAuth callback host.
      - TINFOIL_PUBLIC_URL: "https://vita-ingest.vitality-now.containers.tinfoil.dev"
      - VITA_INGEST_CORS_ORIGINS: "https://app.vitadao.com,https://staging-app.vitadao.com"
      # Sentry is enabled only if the vita-ingest runtime supports it and the
      # SENTRY_DSN secret is set in Tinfoil. Keep traces off by default.
      - SENTRY_ENVIRONMENT: "production"
      - SENTRY_RELEASE: "vita-ingest@f90c3b67"
      - VITA_INGEST_VERSION: "vita-ingest@f90c3b67"
      - SENTRY_TRACES_SAMPLE_RATE: "0"
      # OAuth callbacks redirect the browser back only to these app origins.
      - DEFAULT_FRONTEND_URL: "https://app.vitadao.com"
      - ALLOWED_REDIRECT_ORIGINS: "https://app.vitadao.com,https://staging-app.vitadao.com"

    secrets:
      # GHCR pull token for ghcr.io/vitadao/vita-ingest.
      - VITA_INGEST_GHCR_TOKEN

      # Supabase. Service-role is currently required by wearable connection
      # token writes inherited from the legacy proxy; do not use this service
      # for private-AI routes.
      - SUPABASE_URL
      - SUPABASE_ANON_KEY
      - SUPABASE_SERVICE_ROLE_KEY

      # OAuth token envelope encryption.
      - CONNECTION_TOKEN_KEK

      # Tinfoil Private Inference / document conversion for raw lab parsing.
      - TINFOIL_API_KEY

      # Sentry error monitoring. DSN is a secret in Tinfoil, never committed.
      - SENTRY_DSN

      # Wearable OAuth credentials.
      - OURA_CLIENT_ID
      - OURA_CLIENT_SECRET
      - WHOOP_CLIENT_ID
      - WHOOP_CLIENT_SECRET
      - WITHINGS_CLIENT_ID
      - WITHINGS_CLIENT_SECRET

shim:
  upstream-port: 8080
  paths:
    # Liveness
    - /health

    # Active ingest routes
    - /api/parse-lab-results
    - /api/wearable/oura/auth
    - /api/wearable/oura/callback
    - /api/wearable/oura/fetch
    - /api/wearable/whoop/auth
    - /api/wearable/whoop/callback
    - /api/wearable/whoop/fetch
    - /api/wearable/whoop/sync
    - /api/wearable/withings/auth
    - /api/wearable/withings/callback
    - /api/wearable/withings/fetch
