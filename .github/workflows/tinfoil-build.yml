name: Build & Attest Tinfoil Image

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write

    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8

      - name: Require a lightweight release tag
        shell: bash
        run: |
          object_type="$(git cat-file -t "$GITHUB_REF")"
          if [ "$object_type" != "commit" ]; then
            echo "Refusing to attest tag object type '$object_type'."
            echo "Production Tinfoil releases must use lightweight Git tags."
            exit 1
          fi

      - name: Reject staging config in production attestation repo
        shell: bash
        run: |
          if grep -Eq 'debug\.vitality-now\.containers\.tinfoil\.dev|STAGING_' tinfoil-config.yml; then
            echo "Refusing to attest a staging/debug config from the production config repository."
            echo "Use a dedicated staging Tinfoil config repository instead."
            exit 1
          fi

      - uses: tinfoilsh/pri-build-action@5d450a7f30904866efc401e24484b935b7ed52dd
        with:
          config-file: ${{ github.workspace }}/tinfoil-config.yml
          github-token: ${{ secrets.GITHUB_TOKEN }}
          prerelease: "false"
